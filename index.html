<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Runner | Animated Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div id="level-display">FOREST ZONE</div>
            <div id="controller-status">🎮 Controller: Disconnected</div>
        </div>
        
        <div class="canvas-relative-wrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <!-- Preload your sprite sheet here -->
            <img id="player-sprite" src="image_576fdc.png" style="display: none;">
        </div>
        
        <div class="controls-guide">
            <p><strong>Controls:</strong> Left Stick / D-Pad to Move | <strong>Button A</strong> to Jump</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
